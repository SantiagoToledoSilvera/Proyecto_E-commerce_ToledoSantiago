<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categoria para administrador</title>
    <link rel="stylesheet" href="/css/standard.css">
    <link rel="stylesheet" href="/css/categoria_admin.css">
</head>
<body>
    <br>
    <br>
    <h1>Editor de categoria</h1>
    <br>
    <table>
        <thead>
            <tr>
                <th>Categoria</th>
                <th>Descripción</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td></td>
            </tr>
        </tbody>
    </table>
    <br>
    <button id="agregar">+ Agregar categoria</button>
    <input type="text" name="nombre" id="nombre" placeholder="Nombre de nueva categoria">
    <input type="text" name="descripciom" id="desc" placeholder="Descripción de categoria">
    <img src="/assets/left corner.png" class="corner_a">
    <img src="/assets/right corner.png" class="corner_b">
    <img src="/assets/botline.png" class="botline">
    <img src="/assets/topline.png" class="topline">
    <img src="/assets/left corner.png" class="corner_c">
    <img src="/assets/right corner.png" class="corner_d">

    <script src="/js/categoria_admin.js"></script>
</body>
</html>
