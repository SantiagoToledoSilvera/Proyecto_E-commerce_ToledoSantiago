<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creador de usuario</title>
    <link rel="stylesheet" href="/css/standard.css">
    <link rel="stylesheet" href="/css/crear_user.css">
</head>
<body>

    <div class="logo">
        <br>
        <h1>Crear una cuenta</h1>
    </div>
    <div class="op">
        <input type="text" id="name" placeholder="Ingrese el nombre de usuario">
        <br><br>
        <input type="text" id="email" placeholder="Ingrese el email a registrar">
        <br><br>
        <input type="password" id="password" placeholder="Ingrese la contraseña">
        <br><br>
        <button id="registrar">Registrarse</button>
        <br>
        <img src="/assets/core.png" class="core">
    </div>

    <img src="/assets/left corner.png" class="corner_a">
    <img src="/assets/right corner.png" class="corner_b">
    <img src="/assets/botline.png" class="botline">
    <img src="/assets/topline.png" class="topline">
    <img src="/assets/left corner.png" class="corner_c">
    <img src="/assets/right corner.png" class="corner_d">

    <script src="/js/crear_user.js"></script>
</body>
</html>
