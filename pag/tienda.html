<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tienda</title>
    <link rel="stylesheet" href="/css/standard.css">
    <link rel="stylesheet" href="/css/tienda.css">
</head>
<body>

    <div class="hero">
    <h1>Luxury Collection</h1>
    <p>
        Moda elegante y minimalista
    </p>
    </div>

    <div class="buscador">
        <input type="text" id="busqueda" placeholder="Buscar un producto específico">
    </div>

    <div class="productos">
    </div>
    <button id="abrirCarrito">
        🛒 Carrito
    </button>
    <div class="modal" id="modalCarrito">
        <div class="contenidoModal">
            <h2>Carrito</h2>
            <div id="itemsCarrito"></div>
            <h3 id="total"></h3>
            <input type="text" id="dni" placeholder="Número identificación">
            <input type="text" id="direccion" placeholder="Dirección">
            <input type="text" id="telefono" placeholder="Teléfono">
            <button id="comprar">
                Comprar
            </button>
            <button id="cerrarCarrito">
                X
            </button>
        </div>
    </div>
    <img src="/assets/left corner.png" class="corner_a">
    <img src="/assets/right corner.png" class="corner_b">
    <img src="/assets/botline.png" class="botline">
    <img src="/assets/topline.png" class="topline">
    <img src="/assets/left corner.png" class="corner_c">
    <img src="/assets/right corner.png" class="corner_d">

<script src="/js/tienda.js"></script>
</body>
</html>
